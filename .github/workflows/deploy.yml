name: Publicar no GitHub Pages

# Disparo manual: a publicação no Pages exige ligar o Pages nas configurações
# do repositório (Settings → Pages → Source: GitHub Actions). Sem isso o job
# falha a cada push. O caminho recomendado hoje é a Vercel, que não precisa de
# nenhuma configuração no GitHub — veja o README.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O app fica servido em /<repositório>/, e o service worker do PWA
      # precisa saber disso para registrar o escopo certo.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
